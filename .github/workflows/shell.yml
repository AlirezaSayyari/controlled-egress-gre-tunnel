name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Run ShellCheck when available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning --exclude=SC1090
          else
            echo "ShellCheck is not available on this runner; skipping."
          fi
