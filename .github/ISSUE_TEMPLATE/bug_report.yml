name: Bug report
description: Report a reproducible GREX runtime problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove credentials, public IP addresses,
        and other sensitive values from all output.
  - type: input
    id: version
    attributes:
      label: GREX version
      description: Output from `sudo grex version`.
      placeholder: v1.2.5
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant output from `sudo grex health`, `sudo grex check`, or logs.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets and sensitive infrastructure details.
          required: true
        - label: I searched existing issues for this problem.
          required: true
